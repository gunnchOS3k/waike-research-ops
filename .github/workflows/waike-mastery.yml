name: waike-mastery
on:
  pull_request:
    paths:
      - 'src/waike_mastery/**'
      - 'scripts/emit_waike_mastery.py'
      - 'tests/mastery/**'
      - 'contracts/**'
      - '.github/workflows/waike-mastery.yml'
  workflow_dispatch:
jobs:
  mastery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: python3 -m pip install pytest
      - name: Mastery tests
        run: python3 -m pytest -q tests/mastery
      - name: Emit mastery artifacts
        run: python3 scripts/emit_waike_mastery.py
